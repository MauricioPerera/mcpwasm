name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hermetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Run spike suite
        run: npm run spike
      - name: Run memspike suite
        run: npm run memspike
      - name: Run gateway suite (offline)
        run: npm run gateway:offline
      - name: Run local runtime suite
        run: npm run local
      - name: Run SQLite capability suite (node:sqlite stable)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm run test:sqlite
      - name: Run security suite (redirect scope, hostile origin)
        run: npm run test:security
      - name: Subpath publishers (project sites, both runtimes)
        run: npm run subpath
      - name: Web runtime smoke (same code the browser runs)
        run: npm run test:web
      - name: Built demo bundle smoke (the artifact GitHub Pages serves)
        run: npm run test:bundle
      - name: Committed demo bundle matches its source (no silent drift)
        run: npm run check:bundle
      - name: Committed docs-site artifact matches its source (no silent drift)
        run: npm run check:docs-site
      - name: Committed demo-site/bookstore artifacts match their source
        run: npm run check:publishers
      - name: Offline attestation signing (attest.mjs -> real gateway, enforcing)
        run: npm run test:attest

  prod-integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run gateway suite (online)
        run: npm run gateway
